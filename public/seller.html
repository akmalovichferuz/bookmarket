<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sotuvchi Do'koni - BookMarket</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg font-sans text-lightText min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Navbar -->
    <header class="bg-darkCard shadow-sm border-b border-darkBorder sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-grayText hover:text-primary transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i> <span class="font-bold">Orqaga</span>
            </button>
            <div class="flex items-center gap-2 text-primary cursor-pointer" onclick="window.location.href='/'">
                <i class="fa-solid fa-book-open-reader text-2xl"></i>
                <h1 class="text-xl font-black">BookMarket</h1>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- ========================================== -->
        <!-- SOTUVCHI PROFILI (HEADER)                  -->
        <!-- ========================================== -->
        <div class="bg-darkCard rounded-3xl shadow-lg border border-darkBorder mb-8 relative overflow-hidden">
            
            <!-- YUKLANMOQDA... (Ma'lumot kelguncha aylanib turadi) -->
            <div id="sellerLoading" class="p-12 flex items-center justify-center min-h-[160px]">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-primary"></i>
            </div>

            <!-- HAQIQIY MA'LUMOTLAR (JS orqali to'ldiriladi va ochiladi) -->
            <div id="sellerContent" class="hidden p-6 md:p-8 flex flex-col lg:flex-row items-center justify-between gap-6 lg:gap-10">
                
                <!-- 1. Chap qism: Ism va Manzil -->
                <div class="flex items-center gap-5 w-full lg:w-auto">
                    <!-- Katta dumaloq initsial -->
                    <div id="sellerInitials" class="w-24 h-24 rounded-full border border-primary/30 flex items-center justify-center bg-primary/10 text-primary text-4xl font-black shrink-0 shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                        <!-- U -->
                    </div>
                    <div>
                        <h2 id="sellerName" class="text-2xl md:text-3xl font-black text-lightText mb-2 truncate">Yuklanmoqda...</h2>
                        <div class="flex flex-wrap items-center gap-4 text-sm text-grayText font-medium">
                            <span id="sellerLocation" class="flex items-center"><i class="fa-solid fa-location-dot text-primary mr-1"></i> - </span>
                            <span id="sellerPhone" class="flex items-center"><i class="fa-solid fa-phone text-primary mr-1"></i> - </span>
                        </div>
                    </div>
                </div>

                <!-- 2. O'rta qism: Statistika qutichasi -->
                <div class="flex items-center gap-8 bg-darkBg border border-darkBorder rounded-2xl px-8 py-4 shrink-0 shadow-inner">
                    <div class="text-center">
                        <div id="sellerBooksCount" class="text-2xl font-black text-lightText">0</div>
                        <div class="text-[10px] font-bold text-primary uppercase tracking-widest mt-1">E'lonlar</div>
                    </div>
                    <div class="text-center">
                        <div id="sellerFollowersCount" class="text-2xl font-black text-lightText">0</div>
                        <div class="text-[10px] font-bold text-primary uppercase tracking-widest mt-1">Mijozlar</div>
                    </div>
                    <div class="text-center">
                        <div id="sellerLikesCount" class="text-2xl font-black text-lightText">0</div>
                        <div class="text-[10px] font-bold text-primary uppercase tracking-widest mt-1">Layklar</div>
                    </div>
                </div>

                <!-- 3. O'ng qism: Tugmalar bu yerga yoziladi -->
                <div class="shrink-0 w-full lg:w-auto flex justify-end" id="buttonsContainer">
                    <!-- JS shu yerdan o'zi chizib beradi (Lichka va Sodiq mijoz tugmalari) -->
                </div>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- KITOBLAR QISMI (Ichki tablar va gridlar)   -->
        <!-- ========================================== -->
        <h2 class="text-2xl font-black text-lightText mb-6">Do'kondagi e'lonlar</h2>
        
        <!-- JS Barcha ma'lumotlarni aynan shu Div ichiga yozadi. Ortiqcha class qo'shilmaydi -->
        <div id="sellerBooksContainer" class="w-full">
            <!-- Kitoblar chiziladi -->
        </div>

    </main>

    <!-- ========================================== -->
    <!-- LICHKA (DIRECT MESSAGE) OYNASI             -->
    <!-- ========================================== -->
    <div id="dmOverlay" class="hidden fixed top-0 right-0 bottom-0 w-full md:w-96 bg-darkCard z-[100] flex-col shadow-[[-10px_0_30px_rgba(0,0,0,0.8)] border-l border-darkBorder">
        <div class="bg-darkBg p-4 border-b border-darkBorder flex items-center gap-4 shrink-0">
            <button onclick="window.closeDM()" class="text-grayText hover:text-white transition w-8 h-8 flex items-center justify-center bg-darkCard rounded-full border border-darkBorder shadow-sm">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="w-10 h-10 bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center font-black" id="dmInitials">U</div>
            <h3 class="font-black text-lightText truncate flex-1" id="dmName">Foydalanuvchi</h3>
        </div>
        <div id="dmMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 bg-darkCard/95 relative scroll-smooth">
            <!-- Xabarlar shu yerga tushadi -->
        </div>
        <div class="p-3 bg-darkBg border-t border-darkBorder flex gap-2 shrink-0">
            <input type="text" id="dmInput" class="flex-1 bg-darkCard border border-darkBorder rounded-xl px-4 py-2 text-sm text-lightText outline-none focus:border-blue-500 transition shadow-inner" placeholder="Xabar yozing..." onkeypress="window.dmEnter(event)">
            <button onclick="window.sendDM()" class="bg-blue-500 hover:bg-blue-600 text-white w-10 h-10 rounded-xl flex items-center justify-center transition shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="./js/seller.js"></script>
</body>
</html>
