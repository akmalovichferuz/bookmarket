<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pochtam - BookMarket</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg font-sans text-lightText min-h-screen flex flex-col relative overflow-x-hidden">
    
    <!-- Navbar -->
    <header class="bg-darkCard shadow-sm border-b border-darkBorder sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-grayText hover:text-indigo-400 transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i> <span class="font-bold">Orqaga</span>
            </button>
            <div class="flex items-center gap-2 text-primary cursor-pointer" onclick="window.location.href='/'">
                <i class="fa-solid fa-envelope text-2xl text-indigo-400"></i>
                <h1 class="text-xl font-black text-lightText">Pochtam</h1>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-3xl">
        <h2 class="text-2xl font-black text-lightText mb-6 border-b border-darkBorder pb-4 flex items-center gap-3">
            <i class="fa-solid fa-inbox text-indigo-400"></i> Xabarlar qutisi
        </h2>
        
        <!-- JS aynan shu joyga xat yozishmalarni ro'yxat qilib chizadi -->
        <div id="inboxContainer" class="flex flex-col gap-4 w-full"></div>
    </main>

    <!-- LICHKA (DIRECT MESSAGE) OYNASI (Temirbeton variant) -->
    <div id="dmOverlay" class="hidden fixed top-0 right-0 bottom-0 w-full md:w-96 bg-darkCard z-[100] flex-col shadow-[0_0_40px_rgba(0,0,0,0.8)] border-l border-darkBorder">
        <div class="bg-darkBg p-4 border-b border-darkBorder flex items-center gap-4 shrink-0">
            <button onclick="window.closeDM()" class="text-grayText hover:text-white transition w-8 h-8 flex items-center justify-center bg-darkCard rounded-full border border-darkBorder shadow-sm">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="w-10 h-10 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center font-black" id="dmInitials">U</div>
            <h3 class="font-black text-lightText truncate flex-1" id="dmName">Foydalanuvchi</h3>
        </div>
        <div id="dmMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 bg-darkCard/95 relative scroll-smooth">
            <!-- Xabarlar shu yerga tushadi -->
        </div>
        <div class="p-3 bg-darkBg border-t border-darkBorder flex gap-2 shrink-0">
            <input type="text" id="dmInput" class="flex-1 bg-darkCard border border-darkBorder rounded-xl px-4 py-2 text-sm text-lightText outline-none focus:border-indigo-500 transition shadow-inner" placeholder="Xabar yozing..." onkeypress="window.dmEnter(event)">
            <button onclick="window.sendDM()" class="bg-indigo-500 hover:bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center transition shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="./js/mail.js"></script>
</body>
</html>
