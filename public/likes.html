<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoqtirishlar - BookMarket</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg font-sans text-lightText min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <header class="bg-darkCard shadow-sm border-b border-darkBorder sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-grayText hover:text-red-500 transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i> <span class="font-bold">Orqaga</span>
            </button>
            <div class="flex items-center gap-2 text-primary cursor-pointer" onclick="window.location.href='/'">
                <i class="fa-solid fa-heart text-2xl text-red-500"></i>
                <h1 class="text-xl font-black text-lightText">Yoqtirishlar</h1>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        <h2 class="text-2xl font-black text-lightText mb-6 border-b border-darkBorder pb-4 flex items-center gap-3">
            <i class="fa-solid fa-heart text-red-500"></i> Mening yoqtirgan e'lonlarim
        </h2>
        
        <!-- JS aynan shu joyga kitoblarni chizadi -->
        <div id="likesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <script src="./js/likes.js"></script>
</body>
</html>
